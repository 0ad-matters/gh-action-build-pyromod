name: Test Action

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  test-community-maps-2:
    runs-on: ubuntu-latest
    env:
      MOD_NAME: community-maps-2
      MOD_VERSION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: 0ad-matters/gh-action-build-pyromod@v2
      with:
        name: ${{ env.MOD_NAME }}
        version: ${{ env.MOD_VERSION }}
        directory: 'test/${{ env.MOD_NAME }}'
    - run: rm -rf /output/*
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Use action from self
      uses: ./
      with:
        name: ${{ env.MOD_NAME }}
        version: ${{ env.MOD_VERSION }}
        directory: 'test/${{ env.MOD_NAME }}'
        remove_from_pyromod: '/maps/random/* /.git* art/particles/*'
    - name: Copy the mod without its .git files
      run: |
        cp -r "test/$MOD_NAME" no-git-mod
        find no-git-mod -name '.git*' -prune -exec rm -rf {} +
    - name: Use action from self on a mod with no .git files
      uses: ./
      with:
        name: ${{ env.MOD_NAME }}
        version: no-git
        directory: no-git-mod
